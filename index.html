<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မင်္ဂလာပါ STUDIO - AI Video Recap & Dubbing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <!-- Header Section -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm p-4 mb-4 border border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-indigo-600">မင်္ဂလာပါ</h1>
                    <span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-semibold">STUDIO</span>
                </div>
                <p class="text-xs text-slate-500">AI Video Recap & Dubbing</p>
            </div>
        </div>
        <button class="flex items-center gap-1 text-xs text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full font-medium">
            <i class="fa-regular fa-circle-question"></i> လမ်းညွှန်
        </button>
    </div>

    <!-- Status Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm p-4 mb-4 border border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <div>
                <p class="text-xs text-slate-400 font-semibold uppercase">STATUS</p>
                <p class="text-sm font-semibold text-slate-700">လက်ရှိ ပရောဂျက် <span class="text-indigo-500">(မရှိသေးပါ)</span></p>
            </div>
        </div>
        <button onclick="location.reload()" class="text-xs text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl hover:bg-rose-50 font-medium transition">
            <i class="fa-solid fa-rotate-left mr-1"></i> အသစ်ပြန်စမည်
        </button>
    </div>

    <!-- Step Navigation Pills -->
    <div class="w-full max-w-md grid grid-cols-4 gap-2 mb-4 text-center">
        <div class="bg-indigo-600 text-white p-2 rounded-xl text-xs font-semibold shadow-md shadow-indigo-100">
            Step 1<br><span class="font-normal text-[10px]">Upload</span>
        </div>
        <div class="bg-slate-200 text-slate-500 p-2 rounded-xl text-xs font-semibold
