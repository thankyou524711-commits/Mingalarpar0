<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မင်္ဂလာပါ STUDIO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Padauk for Burmese text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Padauk', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen p-4 flex flex-col items-center justify-start pb-10">

    <div class="w-full max-w-md space-y-3.5">

        <div class="bg-white rounded-[28px] p-3.5 px-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button class="w-10 h-10 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-2xl flex items-center justify-center text-slate-700 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-2xl font-bold text-[#4f46e5] leading-none tracking-tight">မင်္ဂလာပါ</h1>
                        <span class="bg-[#e0e7ff] text-[#4338ca] text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">STUDIO</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-semibold mt-0.5">AI Video Recap & Dubbing</p>
                </div>
            </div>
            <button class="bg-[#e0e7ff]/70 hover:bg-[#e0e7ff] text-[#4338ca] text-xs px-3.5 py-2 rounded-full font-bold flex items-center gap-1.5 transition active:scale-95">
                <svg class="w-4 h-4 text-[#4338ca]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
                <span>လမ်းညွှန်</span>
            </button>
        </div>

        <div class="bg-white rounded-[28px] p-3.5 px-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 bg-[#10b981] rounded-full animate-pulse"></span>
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">STATUS</p>
                    <p class="text-sm font-bold text-slate-700">လက်ရှိ ပရောဂျက် <span class="text-[#6366f1] font-normal">(မရှိသေးပါ)</span></p>
                </div>
            </div>
            <button onclick="location.reload()" class="border border-[#fca5a5] text-[#ef4444] text-xs px-3.5 py-1.5 rounded-full font-bold flex items-center gap-1 hover:bg-rose-50 active:scale-95 transition">
                <svg class="w-3.5 h-3.5 text-[#ef4444]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>အသစ်ပြန်စမည်</span>
            </button>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <div class="bg-[#4f46e5] text-white p-2.5 rounded-2xl text-center shadow-md shadow-indigo-100">
                <p class="text-xs font-bold">Step 1</p>
                <p class="text-[10px] opacity-90">Upload</p>
            </div>
            <div class="bg-[#f1f5f9] text-slate-400 p-2.5 rounded-2xl text-center">
                <p class="text-xs font-bold">Step 2</p>
                <p class="text-[10px]">Source</p>
            </div>
            <div class="bg-[#f1f5f9] text-slate-400 p-2.5 rounded-2xl text-center">
                <p class="text-xs font-bold">Step 3</p>
                <p class="text-[10px]">Burmese</p>
            </div>
            <div class="bg-[#f1f5f9] text-slate-400 p-2.5 rounded-2xl text-center">
                <p class="text-xs font-bold">Step 4</p>
                <p class="text-[10px]">Result</p>
            </div>
        </div>

        <div class="bg-white rounded-[32px] p-5 shadow-sm border border-slate-100 space-y-4">
            
            <!-- Step Header Title -->
            <div class="space-y-0.5">
                <div class="flex items-center gap-2.5">
                    <span class="w-6 h-6 bg-[#e0e7ff] text-[#4338ca] rounded-full flex items-center justify-center text-xs font-bold">1</span>
                    <h2 class="text-base font-bold text-slate-800">Video တင်ပါ (Upload File)</h2>
                </div>
                <p class="text-xs text-slate-400 pl-8">MP4, MOV, WEBM သို့မဟုတ် MKV ဖိုင်တင်ပါ</p>
            </div>

            <!-- Upload Box Zone -->
            <div class="border-2 border-dashed border-[#c7d2fe] bg-[#f5f3ff]/40 rounded-2xl p-8 flex flex-col items-center justify-center gap-2 relative text-center hover:bg-[#eef2ff]/50 transition">
                <input type="file" id="videoInput" accept="video/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                <div class="w-12 h-12 bg-[#e0e7ff] text-[#4f46e5] rounded-2xl flex items-center justify-center text-xl mb-1 shadow-sm">
                    <svg class="w-6 h-6 text-[#4f46e5]" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </div>
                <p id="fileNameDisplay" class="text-sm font-bold text-slate-700">နှိပ်၍ Video File ရွေးချယ်ပါ</p>
                <p class="text-xs text-slate-400">Max file size: 100MB</p>
            </div>

            <!-- Action Button -->
            <button onclick="startProcess()" class="w-full bg-[#a5b4fc] hover:bg-[#6366f1] text-white font-bold py-3.5 rounded-2xl text-sm transition-all shadow-sm flex items-center justify-center gap-2 active:scale-[0.99]">
                <span>Step 1: အသံထုတ်မည် (Next)</span>
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>

    </div>

    <div class="mt-7 flex justify-center">
        <div class="w-12 h-12 bg-[#0f172a] rounded-full flex items-center justify-center shadow-lg">
            <svg class="w-5 h-5 text-[#fbbf24]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
            </svg>
        </div>
    </div>

    <script>
        document.getElementById('videoInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                document.getElementById('fileNameDisplay').textContent = e.target.files[0].name;
            }
        });

        function startProcess() {
            const file = document.getElementById('videoInput').files[0];
            if (!file) {
                alert('ကျေးဇူးပြု၍ Video File တစ်ခု ရွေးချယ်ပေးပါ');
                return;
            }
            alert('Video Upload စတင်နေပါပြီ...');
        }
    </script>
</body>
</html>
